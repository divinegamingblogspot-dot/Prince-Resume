name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-pages]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify portfolio structure
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          test -f resume.html
          test -f robots.txt
          test -f sitemap.xml
          grep -q 'hero-meta-link' index.html
          grep -q 'id="systems"' index.html
          grep -q 'ME N U</h3>' index.html
          grep -q 'animation:marquee' style.css
          grep -q 'animation-play-state:running' style.css
          echo "Portfolio structure and requested interactions verified."
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

# Final verification marker
